<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Esperança - Contato</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header-container">
    <div class="logo-area">
      <img src="../img/logo.png" alt="Logotipo da ONG Esperança" class="logo-img">
    </div>

      <button class="menu-button" aria-label="Abrir menu">☰</button>

    <nav class="nav-menu">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="contato.html" class="active">Contato</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="hero-section">
      <h1>Fale Conosco</h1>
      <p>Dúvidas, sugestões ou quer se tornar um parceiro? Envie uma mensagem!</p>
    </section>

    <section class="form-container">
     <form class="custom-form">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
        </div>

        <button type="submit" class="btn-primary">Enviar Mensagem</button>
        <p id="mensagem-status"></p>
      </form>
    </section>
  </main>

  <footer class="footer-container">
    <p>&copy; 2026 ONG Esperança - Todos os direitos reservados.</p>
  </footer>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
