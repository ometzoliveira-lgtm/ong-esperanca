<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Esperança - Cadastro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header-container">
    <div class="logo-area">
      <img src="../img/logo.png" alt="Logotipo da ONG Esperança" class="logo-img">
    </div>

       <button class="menu-button" aria-label="Abrir menu">☰</button>

    <nav class="nav-menu">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="contato.html">Contato</a></li>
        <li><a href="cadastro.html" class="active">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="hero-section">
      <h1>Formulário de Cadastro</h1>
      <p>Cadastre-se para participar dos nossos programas ou atuar como voluntário.</p>
    </section>

    <section class="form-container">
      <form class="custom-form">
        <fieldset>
          <legend>Dados Pessoais</legend>
          <div class="form-group">
            <label for="nome-cad">Nome Completo:</label>
            <input type="text" id="nome-cad" required placeholder="Ex: Maria Silva">
          </div>
          <div class="form-group">
            <label for="email-cad">E-mail:</label>
            <input type="email" id="email-cad" required placeholder="maria@email.com">
          </div>
          <div class="form-group">
            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" required>
          </div>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>
          <div class="form-group">
            <label for="cep">CEP:</label>
            <input type="text" id="cep" pattern="[0-9]{5}-[0-9]{3}" required placeholder="00000-000">
          </div>
          <div class="form-row">
            <div class="form-group flex-2">
              <label for="cidade">Cidade:</label>
              <input type="text" id="cidade" required placeholder="Sua cidade">
            </div>
            <div class="form-group flex-1">
              <label for="estado">Estado (UF):</label>
              <input type="text" id="estado" maxlength="2" required placeholder="SP">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Documentos e Contato</legend>
          <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required placeholder="000.000.000-00">
          </div>
          <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" required placeholder="11-99999-9999">
          </div>
        </fieldset>

        <button type="submit" class="btn-primary">Finalizar Cadastro</button>
        <p id="cadastro-status"></p>
      </form>
    </section>
  </main>

  <footer class="footer-container">
    <p>&copy; 2026 ONG Esperança - Todos os direitos reservados.</p>
  </footer>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
